<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 题目数据工坊</title>
<style>
  :root{
    --surface:#fff; --ink:#0f172a; --muted:#5b6472; --faint:#94a1b2;
    --line:#e6e9ef; --accent:#4f46e5; --accent-ink:#4338ca; --danger:#b91c1c;
    --mono:"Cascadia Code",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    color:var(--ink); background:#f6f7f9;
    font:14px/1.65 "Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(720px 420px at 18% 8%, rgba(99,102,241,.13), transparent 62%),
      radial-gradient(680px 420px at 88% 92%, rgba(56,189,248,.12), transparent 60%);
  }
  .card{
    width:100%; max-width:384px; background:var(--surface);
    border:1px solid rgba(255,255,255,.8); border-radius:18px;
    padding:34px 30px 26px;
    box-shadow:0 30px 70px -34px rgba(15,23,42,.4), 0 2px 8px rgba(15,23,42,.04);
  }
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:8px}
  .mark{
    width:32px; height:32px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(140deg,#6366f1,#4338ca);
    box-shadow:0 3px 10px rgba(79,70,229,.32), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .mark svg{width:17px; height:17px; stroke:#fff; fill:none; stroke-width:1.7; stroke-linecap:round}
  h1{font-size:16.5px; font-weight:680; margin:0; letter-spacing:-.02em}
  .sub{color:var(--muted); font-size:12.5px; margin:0 0 24px; padding-left:43px}
  label{display:block; font-size:12px; font-weight:500; color:var(--muted); margin:0 0 6px}
  input{
    width:100%; height:40px; padding:0 12px; border:1px solid var(--line); border-radius:9px;
    font:inherit; font-size:14px; color:var(--ink); background:#fff; outline:none;
    transition:border-color .14s, box-shadow .14s;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .field{margin-bottom:15px}
  button{
    width:100%; height:40px; margin-top:6px; border:0; border-radius:9px; cursor:pointer;
    background:linear-gradient(180deg,#5b52ea,#4f46e5); color:#fff;
    font:inherit; font-size:14px; font-weight:600;
    box-shadow:0 1px 2px rgba(67,56,202,.3), inset 0 1px 0 rgba(255,255,255,.16);
    transition:filter .14s, transform .06s;
  }
  button:hover{filter:brightness(1.04)}
  button:active{transform:translateY(.5px)}
  button:disabled{opacity:.6; cursor:default; filter:none}
  .msg{min-height:18px; margin-top:12px; font-size:12.5px; color:var(--danger); line-height:1.6}
  .foot{
    margin-top:8px; padding-top:15px; border-top:1px solid var(--line);
    color:var(--faint); font-size:11.5px; line-height:1.7;
  }
  .foot a{color:var(--accent); text-decoration:none}
  .foot a:hover{text-decoration:underline}
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17 12 21l9-4"/></svg></span>
      <h1>题目数据工坊</h1>
    </div>
    <p class="sub">导入题目 · 生成测试数据 · 对抗数据</p>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" placeholder="学号（12 位）" required />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <button id="submit" type="submit">登录</button>
    <div class="msg" id="msg"></div>
    <div class="foot">用户名填学号，密码见管理员下发的名单；所有人共用一份题库。<br>问题或建议：登录后点顶部「反馈」，也可以到 <a href="https://github.com/Molight1007/autocodedaimabangzhu" target="_blank" rel="noopener">项目地址</a> 提 Issue。</div>
  </form>
<script>
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    msg.textContent = '';
    submit.disabled = true;
    submit.textContent = '登录中…';
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) {
        location.replace('/');
        return;
      }
      msg.textContent = data.retry_after
        ? `尝试过于频繁，请 ${data.retry_after} 秒后再试`
        : (data.error || '登录失败');
    } catch (error) {
      msg.textContent = '无法连接服务，请确认服务已启动';
    } finally {
      submit.disabled = false;
      submit.textContent = '登录';
    }
  });
</script>
</body>
</html>
