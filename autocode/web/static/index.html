<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236366f1%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%234338ca%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M24%2020%2014%2032l10%2012%22/%3E%3Cpath%20d%3D%22M40%2020l10%2012-10%2012%22/%3E%3Cpath%20d%3D%22M36%2016l-8%2032%22/%3E%3C/g%3E%3C/svg%3E" />
<title>autoCode · 出题工作台</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#fff; --surface-2:#fafbfc;
    --text:#111827; --muted:#6b7280; --faint:#9ca3af;
    --border:#e5e7eb; --border-strong:#d1d5db;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --green:#059669; --green-soft:#ecfdf5;
    --amber:#b45309; --amber-soft:#fffbeb;
    --red:#dc2626; --red-soft:#fef2f2;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  body{background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  .app{max-width:1200px;margin:0 auto;padding:0 24px 72px}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar-inner{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.28)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .nav{display:flex;gap:4px;margin-left:16px}
  .nav a{padding:7px 13px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600}
  .nav a:hover{background:#eceef2;color:var(--text)}
  .nav a.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .spacer{flex:1}
  .icon-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:#f3f4f6;color:#4b5563}
  .pill.green{background:var(--green-soft);color:var(--green)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 8px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .label{color:var(--muted);font-size:12px}
  .stat .value{font-size:28px;font-weight:700;letter-spacing:-.3px}
  .stat .sub{font-size:12px;color:var(--faint)}
  .tabs{display:flex;gap:6px;margin:20px 0 12px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600}
  .tab:hover{background:#eceef2}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px}
  .chip:hover{border-color:var(--border-strong);color:var(--text)}
  .chip.active{background:var(--accent-soft);border-color:#c7d2fe;color:var(--accent);font-weight:600}
  select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 10px;color:var(--muted)}
  .list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .list-head{display:grid;grid-template-columns:44px 1fr 84px 84px 96px 28px;gap:12px;padding:10px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);color:var(--faint);font-size:12px}
  .list-head div:nth-child(3),.list-head div:nth-child(4){text-align:right}
  .row{display:grid;grid-template-columns:44px 1fr 84px 84px 96px 28px;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--surface-2)}
  .row-id{font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
  .row-title{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row-sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#f3f4f6;color:#4b5563;border-radius:6px;padding:1px 7px;font-size:11px}
  .tag.inj{background:var(--red-soft);color:var(--red)}
  .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
  .status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;text-align:center}
  .status.ok{background:var(--green-soft);color:var(--green)} .status.bad{background:var(--red-soft);color:var(--red)} .status.wait{background:var(--amber-soft);color:var(--amber)}
  .chev{color:var(--faint);text-align:center}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:15px}
  .hero{margin:26px 0 16px}
  .hero h1{margin:0 0 6px;font-size:26px;letter-spacing:-.4px}
  .hero p{margin:0;color:var(--muted)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface);outline:none}
  .field textarea{resize:vertical;min-height:180px;line-height:1.6}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{padding:9px 16px;border-radius:10px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#4338ca}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .check{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
  .hintline{color:var(--muted);font-size:12px}
  .detail-head{display:flex;align-items:flex-start;gap:12px;margin:22px 0 6px;flex-wrap:wrap}
  .detail-title{font-size:24px;font-weight:700;letter-spacing:-.3px;margin:0}
  .detail-sub{color:var(--muted);font-size:12px;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .back{color:var(--muted);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-top:20px}
  .back:hover{color:var(--text)}
  .sec{margin-bottom:22px}
  .sec h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  /* 题面：中文阅读排版（原来用 .mono 等宽 12.5px，`###` 会裸奔、行距松散） */
  .statement{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.85;color:var(--text);white-space:normal;max-width:76ch}
  .statement h4{margin:22px 0 10px;font-size:17px;line-height:1.5;font-weight:700;color:var(--text);
    padding-left:10px;border-left:3px solid var(--accent)}
  .statement h4:first-child{margin-top:2px}
  .statement p{margin:0 0 9px}
  .statement strong{font-weight:700;color:#0f172a}
  .statement ul,.statement ol{margin:6px 0 10px;padding-left:24px}
  .statement li{margin:4px 0}
  .statement pre.data{margin:8px 0 12px;padding:10px 14px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px;line-height:1.65;white-space:pre-wrap;overflow:auto}
  .statement code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
    background:var(--accent-soft);color:#3730a3;padding:1px 5px;border-radius:6px}
  .statement pre code{background:none;padding:0;color:inherit}
  .statement figure{margin:16px 0 18px;text-align:center}
  .statement figure img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:10px;
    background:#fff;padding:6px;box-shadow:var(--shadow)}
  .statement figcaption{font-size:12px;color:var(--muted);margin-top:6px}
  .statement .fig-missing{display:inline-block;margin:10px 0;padding:6px 10px;border:1px dashed var(--amber);
    border-radius:8px;background:var(--amber-soft);color:var(--amber);font-size:12px}
  pre.code{margin:10px 0 0;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px 16px;overflow:auto;max-height:520px;font-size:12.5px;line-height:1.55}
  .method{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
  .method-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .method-body{padding:12px 14px}
  .method-name{font-weight:700}
  .langtabs{display:flex;gap:6px;margin-bottom:12px}
  .langtab{padding:6px 12px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}
  .langtab.active{background:var(--accent-soft);border-color:#c7d2fe;color:var(--accent)}
  .langtab:disabled{opacity:.4;cursor:not-allowed}
  .copy{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:8px;background:var(--surface)}
  .copy:hover{color:var(--text);border-color:var(--border-strong)}
  /* 提示树：根（通用提示）→ 分支（解法）→ 该解法的 L2/L3/L4 */
  .htree{position:relative;padding-left:24px}
  .htree:before{content:'';position:absolute;left:8px;top:16px;bottom:16px;width:2px;background:var(--border)}
  .hroot{position:relative;margin-bottom:12px}
  .hroot:before{content:'';position:absolute;left:-21px;top:17px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .hcard{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:13px 16px}
  .hcard p{margin:7px 0 0;font-size:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
  .hbranches{display:flex;flex-direction:column;gap:6px}
  .hbranch{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:10px 12px;border-radius:9px;border:1px solid transparent;color:var(--muted);font-size:13.5px;font-weight:600}
  .hbranch:before{content:'';position:absolute;left:-16px;top:50%;width:12px;height:2px;background:var(--border)}
  .hbranch:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}
  .hbranch.active{background:var(--accent-soft);border-color:#c7d2fe;color:var(--accent)}
  .hdot.small{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.65;flex:none}
  .hbranch .hintline{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbranch-caret{margin-left:auto;font-size:12px;font-weight:500;opacity:.75;flex:none}
  .hchildren{margin:6px 0 8px 10px;padding-left:16px;border-left:1px dashed var(--border-strong);
    display:flex;flex-direction:column;gap:8px}
  .hint-lock{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px dashed var(--border-strong);
    background:var(--surface-2);border-radius:10px;padding:11px 14px;color:var(--muted);cursor:pointer;font-size:13px;margin:0}
  .hint-lock:hover{border-color:var(--accent);color:var(--accent)}
  .hint-open{border:1px solid var(--border);border-left:3px solid #c7d2fe;background:var(--surface-2);
    padding:13px 16px;border-radius:0 10px 10px 0;margin:0}
  .hint-open b{color:var(--accent);font-size:12px}
  .hint-open p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.85}
  .hint-open .hint-code{margin:9px 0 0;padding:11px 13px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;
    overflow:auto;white-space:pre-wrap}
  .hint-level{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .hint-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hint-flag{padding:2px 8px;font-size:11px;gap:4px}
  .hint-lock .hint-flag{margin-left:8px;vertical-align:middle}
  /* 解法选择器 + 解析正文（学生要能按方法切换，不能所有解法堆成一坨） */
  .mchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .mchip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .mchip:hover{border-color:var(--border-strong);color:var(--text)}
  .mchip.active{background:var(--accent-soft);border-color:#c7d2fe;color:var(--accent);font-weight:600}
  .mchip .cx{font-size:12px;color:var(--faint);font-weight:400}
  .mchip.active .cx{color:var(--accent);opacity:.8}
  .prose{font-size:15px;line-height:1.9;color:var(--text);overflow-wrap:anywhere}
  .prose p{margin:0 0 10px} .prose p:last-child{margin-bottom:0}
  .prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
  .prose li{margin:4px 0}
  .prose .p-sub{font-weight:700;font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:.02em}
  .prose .p-sub:first-child{margin-top:0}
  .prose code{background:#f3f4f6;border-radius:5px;padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
  /* 逐行代码解析：行号 | 真实代码 | 该行讲解，三列对照 */
  .ln-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .ln-head{padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);
    font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ln-row{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,1.05fr);
    border-bottom:1px solid var(--border);align-items:stretch}
  .ln-row:last-child{border-bottom:0}
  .ln-num{padding:9px 8px;text-align:right;background:var(--surface-2);border-right:1px solid var(--border);
    font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--faint);user-select:none}
  .ln-code{padding:9px 11px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;
    font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);border-right:1px solid var(--border)}
  .ln-ex{padding:9px 11px;font-size:13.5px;line-height:1.72;color:var(--muted)}
  .ln-ex.empty{color:var(--faint);font-style:italic}
  .ln-pit{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--surface-2);
    border:1px solid var(--border);font-size:13px;color:var(--muted)}
  @media(max-width:820px){
    .ln-row{grid-template-columns:40px minmax(0,1fr)}
    .ln-code{border-right:0}
    .ln-ex{grid-column:2;border-top:1px dashed var(--border)}
  }
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .plan-card{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:11px 13px}
  .plan-card b{font-size:13px}
  .plan-card .hintline{margin-top:5px}
  .hint-progress{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:var(--muted);font-size:12.5px}
  .hint-progress .bar{flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden;max-width:220px}
  .hint-progress .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
  .issue .msg ul{margin:6px 0 0;padding-left:18px} .issue .msg li{margin:3px 0;word-break:break-word}
  .layer{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .p-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .editor{width:100%;min-height:280px;background:#0f172a;color:#e2e8f0;border:1px solid #1e293b;border-radius:12px;padding:14px 16px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;outline:none;tab-size:4}
  .editor:focus{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
  #custom-input{background:var(--surface);color:var(--text);border-color:var(--border);min-height:110px}
  #custom-input:focus{border-color:var(--accent)}
  .verdict{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .verdict.ac{background:var(--green-soft);color:var(--green)} .verdict.bad{background:var(--red-soft);color:var(--red)} .verdict.warn{background:var(--amber-soft);color:var(--amber)}
  .case-table{border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .case-row{display:grid;grid-template-columns:1fr 80px 70px 70px;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;align-items:center}
  .case-row:last-child{border-bottom:none}
  .case-row.head{background:var(--surface-2);color:var(--muted);font-weight:600}
  .diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .diff pre{margin:0;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:180px;overflow:auto}

  /* ── 数据评分卡 ───────────────────────────────── */
  .scorecard{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start}
  .gauge{position:relative;width:132px;height:132px;border-radius:50%;flex:none;
    background:conic-gradient(var(--gc,#4f46e5) calc(var(--v,0)*1%),#eceef2 0);display:grid;place-items:center}
  .gauge::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
  .gauge .vin{position:relative;z-index:1;text-align:center;line-height:1.05}
  .gauge .vin b{display:block;font-size:40px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--gc,#111827)}
  .gauge .vin span{display:block;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.4px}
  .gauge.empty{background:conic-gradient(#eceef2 0,#eceef2 0)}
  .gauge.empty .vin b{color:var(--faint);font-size:32px}
  .score-side{min-width:0}
  .score-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .score-title b{font-size:15px}
  .score-title .hintline{margin:0}
  .issue{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:10px;font-size:13px;
    margin-bottom:7px;border:1px solid transparent;line-height:1.5}
  .issue .i{margin-top:2px}
  .issue.warn{background:var(--amber-soft);border-color:#fde68a;color:#92400e}
  .issue.error{background:var(--red-soft);border-color:#fecaca;color:#991b1b}
  .issue.ok{background:var(--green-soft);border-color:#a7f3d0;color:#065f46}
  .issue code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;opacity:.65;margin-left:4px}
  .issue .msg{flex:1;min-width:0}
  .statline{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border-strong);
    border-radius:9px;padding:8px 11px;margin-top:4px}

  /* ── 合并我的数据 / 导出历史 ─────────────────── */
  .filepick{display:inline-flex;align-items:center;gap:6px}
  .case-row.cols4{grid-template-columns:56px 1fr 92px 128px}
  .case-row.cols4 .v{font-weight:700;color:var(--accent)}
  .case-row.cols4 .mono{line-height:1.45}
  .nowrap{white-space:nowrap}
  .card pre.pv{margin:6px 0 0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:180px;overflow:auto}
  .sumline{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 8px}
  .req-list{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
  .req-list li{margin-bottom:3px}
  .req-list code{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:0 4px}

  /* ── 任务状态徽标 ─────────────────────────────── */
  .job-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .job-err{color:var(--red);font-size:12px;word-break:break-word}

  /* ── 批量导入结果 ─────────────────────────────── */
  .batch-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .batch-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:7px 10px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--border)}
  .batch-item.bad{background:var(--red-soft);border-color:#fecaca}
  .batch-item a{color:var(--accent);font-weight:600;text-decoration:none}
  .skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef0f3,#f6f7f9,#eef0f3);background-size:200% 100%;animation:sk 1.1s linear infinite}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 11px}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input{border:none;outline:none;background:none;width:100%;font-size:13px}
  .i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
  .i-sm{width:14px;height:14px} .i-lg{width:22px;height:22px}
  .i-btn{display:inline-flex;align-items:center;gap:6px}
  .stat{position:relative}
  .stat .ico{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .stat .ico.green{background:var(--green-soft);color:var(--green)}
  .stat .ico.amber{background:var(--amber-soft);color:var(--amber)}
  .stat .ico.gray{background:#f3f4f6;color:#6b7280}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:5px;vertical-align:1px}
  .nav a{display:inline-flex;align-items:center;gap:6px}
  .tab{display:inline-flex;align-items:center;gap:6px}
  .empty .i{display:block;margin:0 auto 10px;width:28px;height:28px;color:var(--faint)}

  .modal[hidden]{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.32);display:grid;place-items:center;z-index:90;padding:20px}
  .modal-card{width:min(520px,94vw);background:var(--surface);border-radius:16px;box-shadow:0 24px 70px rgba(16,24,40,.25);padding:22px 24px}
  .modal-card h3{margin:0 0 4px;font-size:17px}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .statusline{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}
  .statusline.ok{color:var(--green)} .statusline.bad{color:var(--red)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.18s;z-index:80}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .row{grid-template-columns:36px 1fr 70px 28px}
    .list-head{display:none}
    .nav{margin-left:0}
    .scorecard{grid-template-columns:1fr;justify-items:center;text-align:left}
    .case-row.cols4{grid-template-columns:44px 1fr 90px}
    .case-row.cols4 > :nth-child(4){display:none}
  }

<script>
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('zh-CN');
const ROUTE = new URLSearchParams(location.search);
const STATE = { problems:[], filter:'all', tier:'', tag:'', q:'', problem:null, tab:'statement', lang:'', revealed:0, studentCode:{}, runResult:null, diagnosis:null, adversarial:null, customInput:'', scope:'samples', model:'deepseek-v4-pro', answerUnlocked:false, hintApproach:'', hintPid:null, hintCode:false,
  answerMethod:'', analysisMethod:'', codeMethod:'', hintUnlocked:{},
  job:null, jobDone:{}, qualityCache:{}, exportsCache:{}, merge:{name:'',cases:[],error:'',result:null,busy:false,force:false},
  batch:false, batchResult:null, singlePlaceholder:'' };
const SOURCE_LABEL = {settings:'界面设置', env:'环境变量', file:'项目 key 文件', missing:'未配置'};
const LANG_LABEL = {cpp:'C++', c:'C', python:'Python'};
const LAYER_CN = {sample:'样例', boundary:'边界', tiny:'极小规模', small:'小规模', mid:'中等规模', exhaustive:'穷举', stress:'压力测试', adversarial:'对抗数据', custom:'自定义', user:'我的数据'};
const TRUST_CN = {oracle:'标准答案', cross_verified:'交叉验证', generated:'生成数据', sample:'样例', reference_only:'未校验', conflict:'解冲突'};
/* reference_only = force 入库、没跑过参考解；conflict = 多个参考解互相矛盾 —— 两者都不能当标准答案，用琥珀色与已校验数据区分 */
const TRUST_UNVERIFIED = {reference_only:1, conflict:1};
const layerName = x => LAYER_CN[x] || x;
const trustName = x => TRUST_CN[x] || x;
const isUnverified = x => !!TRUST_UNVERIFIED[String(x||'')];
function trustPill(t){const raw=String(t||'');if(!raw)return '';const amber=isUnverified(raw);return `<span class="pill ${amber?'amber':''}" title="trust_level=${esc(raw)}">${esc(trustName(raw))}</span>`;}
const SIZE_CN = {sample:'样例', max:'最大规模', small:'小规模', mid:'中规模', medium:'中等', large:'大规模', tiny:'极小规模', edge:'边界', llm_edge:'边界(模型定向)', user:'我的用例'};
const DESKTOP_FLAG = new URLSearchParams(location.search).get('desktop') === '1';
/* 桌面判定必须在“调用时”做：pywebview 可能把本地页交给内建 HTTP 服务器托管，
   `?desktop=1` 会丢、protocol 也变成 http；只认启动参数会导致前端去 fetch 静态服务器，
   POST /api/* 直接吃 405 HTML（2026-11-17 题库空白 + PDF 导入报 405 的真因）。 */
function desktopMode(){
  return DESKTOP_FLAG || location.protocol === 'file:' || !!(window.pywebview && window.pywebview.api);
}

function ensureBridge(){
  if(!desktopMode() || (window.pywebview && window.pywebview.api)) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('桌面桥加载超时')),15000);
    window.addEventListener('pywebviewready',()=>{clearTimeout(timer);resolve();},{once:true});
  });
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
async function api(path,opts={}){
  if(desktopMode()){
    if(!window.pywebview || !window.pywebview.api) throw new Error('桌面桥未就绪');
    const payload=opts.body?JSON.parse(opts.body):{};
    const data=await window.pywebview.api.request(path,payload,opts.method||'GET');
    /* 桥不做 HTTP 状态码，业务失败同样回来 {"error":...}：这里必须转成异常，
       否则 merge/batch/generate 会把失败当成功（浏览器分支靠 res.ok 抛） */
    if(isErrEnvelope(data)) throw new Error(data.error||'请求失败');
    return data;
  }
  /* 服务端 _guard 要求 POST 必须是 application/json：这里统一补默认头，
     调用方漏写也不会 415（已有 Content-Type 时不覆盖） */
  const method=String(opts.method||'GET').toUpperCase();
  let req=opts;
  if(method!=='GET'){
    const headers=Object.assign({},opts.headers||{});
    const hasCT=Object.keys(headers).some(k=>k.toLowerCase()==='content-type');
    if(!hasCT) headers['Content-Type']='application/json';
    req=Object.assign({},opts,{headers});
  }
  const res=await fetch(path,req); if(!res.ok) throw new Error(await res.text()); return res.json();
}
const postJSON=(path,body)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
/* 契约接口可能尚未上线：不抛异常，返回 {ok,error,data}，用于渲染空态/错误态 */
function isErrEnvelope(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) return false;
  /* 生成任务本身就有 error 字段（失败原因），不能当错误信封 */
  if(d.status==='queued'||d.status==='running'||d.status==='done'||d.status==='failed') return false;
  if(d.ok===false) return true;
  if(typeof d.error!=='string'||!d.error) return false;
  return Object.keys(d).every(k=>k==='error'||k==='ok'||k==='status');
}
async function apiTry(path,opts={}){
  try{
    const data=await api(path,opts);
    if(isErrEnvelope(data)) return {ok:false,error:String(data.error),data};
    return {ok:true,data};
  }catch(e){ return {ok:false,error:cleanErr(e&&e.message)}; }
}
function cleanErr(msg){
  const raw=String(msg||'');
  const m=raw.match(/"error"\s*:\s*"([^"]*)"/);
  if(m) return m[1];
  if(/failed to fetch|networkerror|load failed/i.test(raw)) return '本地服务未响应';
  return (raw||'请求失败').slice(0,180);
}
/* 把后端原始异常翻成人话（原文塞进 title，便于排查） */
function humanErr(err){
  const e=cleanErr(err);
  if(/invalid literal for int|Internal Server Error|Traceback/i.test(e)) return '服务端暂未提供该接口';
  if(/not found|404/i.test(e)) return '接口尚未接入';
  if(/本地服务未响应/i.test(e)) return '本地服务未响应，请确认程序还在运行';
  return e;
}
const fmtBytes=b=>{const n=Number(b||0);if(!n)return '—';if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';};
const fmtTime=t=>{if(!t)return '—';const d=new Date(String(t).replace(' ','T'));if(isNaN(d))return String(t);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
const fmtAgo=t=>{if(!t)return '';const d=new Date(String(t).replace(' ','T'));if(isNaN(d))return '';const s=Math.max(0,Math.round((Date.now()-d.getTime())/1000));if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return Math.floor(s/86400)+' 天前';};

const STAGE_LABEL = {spec:'题面解析失败', generator:'数据生成器未通过', references:'参考解未通过样例/对拍',
  datasets:'分层数据生成失败', hints:'提示生成失败', artifacts:'产物未达新版契约（多解/逐行解析/提示分组/数据量/题解）',
  budget:'调用预算熔断', timeout:'单题超时'};
function statusPill(p){
  /* 任务状态优先：排队/在跑的题往往还是 draft/preparing，只看题目状态会显示成「待生成」 */
  if(p.job_status==='queued') return '<span class="status wait" title="前面的任务结束会自动开始">排队中</span>';
  if(p.job_status==='running') return '<span class="status wait">生成中…</span>';
  if(p.status==='failed'){
    // 失败题往往还挂着上一版产物：必须同时告诉他「要处理」和「现在看到的是旧内容」，
    // 否则用户会以为改流程没生效（旧版/新版在界面上长得一样）。
    const why = STAGE_LABEL[p.failed_stage] || p.failed_stage || '';
    const label = p.needs_upgrade ? '需处理 · 旧版内容' : '需处理';
    return `<span class="status bad" title="${esc(why || '上次生成失败')}">${label}</span>`;
  }
  if(p.status==='prepared'){
    // 旧版产物：用改流程之前的代码生成的——界面看着像新的，内容其实不是。
    // 只有 artifact_version 能区分，所以必须显式标出来，否则用户会以为改动没生效。
    return p.needs_upgrade
      ? '<span class="status wait" title="用旧版流程生成；跑 prepare --all 会自动升级">旧版 · 待升级</span>'
      : '<span class="status ok">已就绪</span>';
  }
  return '<span class="status wait">待生成</span>';
}

function batchResultHtml(r){
  const imported=r.imported||[], failed=r.failed||[];
  if(!imported.length&&!failed.length) return '<div class="batch-list"><div class="batch-item bad">接口未返回清单（POST /api/import/batch 可能尚未接入）</div></div>';
  /* 块序号一律用后端返回的 index（0 基）；后端会把被丢弃的纯标题块也放进 failed 并带原始 index，
     前端自己按 --- 数的块数会错位，所以只把数组下标当兜底。（G6） */
  const ord=(x,i)=>`${Number(x&&x.index!=null?x.index:i)+1}`;
  return `<div class="batch-list">
    ${imported.map((x,i)=>`<div class="batch-item"><svg class="i i-sm" style="color:var(--green);margin-top:3px"><use href="#i-check-circle"/></svg>

function methodGroups(p){
  const groups={};
  const fallback=(p.solutions.find(x=>x.approach)||{}).approach||'未标注方法';
  for(const s of p.solutions){
    const key=s.approach||fallback;
    (groups[key]=groups[key]||{name:key, complexity:s.complexity||'', solutions:[]}).solutions.push(s);
  }
  return Object.values(groups);
}

/* 轻量排版：段落 / 无序 / 有序 / 小标题 / 加粗 / 行内代码；入参未转义，内部先 esc */
function renderProse(raw){
  const text=esc(String(raw||'')).replace(/\r\n?/g,'\n').trim();
  if(!text) return '';
  return text.split(/\n{2,}/).map(block=>{
    const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!lines.length) return '';
    if(lines.every(l=>/^[-*·]\s+/.test(l)))
      return `<ul>${lines.map(l=>`<li>${inlineMd(l.replace(/^[-*·]\s+/,''))}</li>`).join('')}</ul>`;
    if(lines.every(l=>/^\d+[.、)]\s*/.test(l)))
      return `<ol>${lines.map(l=>`<li>${inlineMd(l.replace(/^\d+[.、)]\s*/,''))}</li>`).join('')}</ol>`;
    if(lines.length===1 && /^\*\*[^*]+\*\*[：:]?$/.test(lines[0]))
      return `<div class="p-sub">${inlineMd(lines[0])}</div>`;
    return `<p>${lines.map(inlineMd).join('<br>')}</p>`;
  }).join('');
}
/* 逐行代码解析：v3 结构化 {v,summary,lines:[{n,code,explain}],pitfalls,coverage}。
   代码原文来自本地参考解，模型只给讲解；旧版纯文本讲解自动降级为普通排版。 */
function renderLineNotes(raw){
  if(!raw) return '';
  if(typeof raw==='string') return renderProse(raw);
  const rows=(raw.lines||[]).map(x=>{
    const n=Number(x.n)||0, code=String(x.code||''), ex=String(x.explain||'').trim();
    return `<div class="ln-row"><div class="ln-num">${n}</div>
      <pre class="ln-code">${esc(code)||' '}</pre>
      <div class="ln-ex ${ex?'':'empty'}">${ex?renderProse(ex):'（模型未单独讲解本行）'}</div></div>`;
  }).join('');
  if(!rows) return renderProse(raw.summary||'');
  const head=`<div class="ln-head">
      ${raw.summary?`<span>${renderProse(raw.summary)}</span>`:''}
      ${raw.coverage?`<span class="pill">逐行覆盖 ${esc(raw.coverage)}</span>`:''}
    </div>`;
  const pit=(raw.pitfalls||[]).length
    ? `<div class="ln-pit"><b>易错点</b><ul style="margin:6px 0 0;padding-left:20px">${raw.pitfalls.map(x=>`<li>${esc(String(x))}</li>`).join('')}</ul></div>` : '';
  return `<div class="ln-wrap">${head}${rows}</div>${pit}`;
}

function watchGeneration(p){
  const gen=(STATE._genGen=(STATE._genGen||0)+1);
  if(STATE._genTimer){ clearInterval(STATE._genTimer); STATE._genTimer=null; }
  const alive=()=>gen===STATE._genGen;
  let timer=setInterval(async()=>{
    if(!alive()){ clearInterval(timer); return; }
    try{
      const fresh=await api(`/api/problems/${p.id}`);
      if(!alive()){ clearInterval(timer); return; }
      if(fresh.status==='prepared'||fresh.status==='failed'){ clearInterval(timer); if(STATE._genTimer===timer) STATE._genTimer=null; location.reload(); }
    }catch(e){}
  },3000);
  STATE._genTimer=timer;
}

/* ── 题面渲染：轻量 Markdown（标题/段落/列表/代码/加粗），入参必须已 esc ── */
function joinProse(a,b){
  if(!a) return b;

}
function inlineMd(s){

      const f=figs[figAt++];
      flushP(); flushData(); flushList();
      out.push(`<figure><img src="${esc(f.url)}" alt="${esc(f.label||'题目插图')}" loading="lazy">`
        +`<figcaption>${f.page?`第 ${Number(f.page)} 页 · `:''}${esc(f.label||'')}</figcaption></figure>`);
    }
  };
  const flushP=()=>{ if(buf){ out.push(`<p>${inlineMd(buf)}</p>`); buf=''; } };
  const flushData=()=>{
    if(!dataBuf.length) return;
    let block=dataBuf;
    /* PDF 样例框的左侧行号列：奇数位恰好是 1..k 时剥掉，避免 1/2/3 与数据交替 */
    if(block.length>=4 && block.length%2===0){
      const odds=block.filter((_,i)=>i%2===0);
      if(odds.every((x,i)=>x.trim()===String(i+1))) block=block.filter((_,i)=>i%2===1);
    }
    /* 形态 B：每行 "行号 内容"，行号恰好 1..k 时剥掉 */
    if(block.length>=3 && block.every(x=>/^\d+\s+/.test(x.trim()))){
      const nums=block.map(x=>Number(x.trim().match(/^(\d+)\s+/)[1]));
      if(nums.every((n,i)=>n===i+1)) block=block.map(x=>x.replace(/^\s*\d+\s+/,''));
    }
    /* 显示层把 Unicode 连字符统一成 ASCII（仅影响观感，不改库里的原文） */
    block=block.map(x=>x.replace(/[\u2010-\u2015\u2212]/g,'-'));
    out.push(`<pre class="data">${block.join('\n')}</pre>`); dataBuf=[];
  };
  const flushList=()=>{ if(list){ out.push(`</${list}>`); list=''; } };
  const isData=t=>!/[A-Za-z\u4e00-\u9fff]/.test(t)
    && /^[\d\s.,:;+\-*/%()=<>[\]{}|\u2010-\u2015\u2212]+$/.test(t) && t.length<=120;
  for(let lineNo=0; lineNo<lines.length; lineNo++){
    flushFigs(lineNo);  // 先把"应在前 N 行之后"的插图输出，再排版正文
    const rawLine=lines[lineNo];
    const line=rawLine.replace(/\s+$/,''); const t=line.trim();
    if(/^```/.test(t)){
      if(fence){ out.push(`<pre class="data"><code>${code.join('\n')}</code></pre>`); code=[]; fence=false; }
      else { flushP(); flushData(); flushList(); fence=true; }
      continue;
    }
    if(fence){ code.push(line); continue; }
    if(!t){
      /* 空行不打断数据块：md 文件常在每行之间插空行，flush 会把样例拆成多个块 */
      /* 只有上一句已经收尾（。！？；：）才认为空行是真正的段落边界；
         否则视为 PDF/Word 的硬换行，继续拼成一段，避免“一行一段”的大空隙。 */
      if(/[。！？；：.!?;:]$/.test(buf)) flushP();
      continue;
    }
    const h=t.match(/^(#{1,4})\s*(.+)$/);
    if(h){ flushP(); flushData(); flushList(); out.push(`<h4>${inlineMd(h[2])}</h4>`); continue; }
    if(/^【[^】]{1,14}】$/.test(t)){ flushP(); flushData(); flushList(); out.push(`<h4>${inlineMd(t)}</h4>`); continue; }
    if(/^.{1,30}（[a-z0-9_-]+）$/.test(t)){ flushP(); flushData(); flushList(); out.push(`<h4>${inlineMd(t)}</h4>`); continue; }
    const li=t.match(/^[-*•]\s+(.+)$/);
    if(li){ flushP(); flushData(); if(list!=='ul'){flushList(); out.push('<ul>'); list='ul';} out.push(`<li>${inlineMd(li[1])}</li>`); continue; }
    const ol=t.match(/^\d+[.、)]\s+(.+)$/);
    if(ol){ flushP(); flushData(); if(list!=='ol'){flushList(); out.push('<ol>'); list='ol';} out.push(`<li>${inlineMd(ol[1])}</li>`); continue; }
    flushList();
    if(isData(t)){ flushP(); dataBuf.push(t); continue; }
    flushData();
    buf=joinProse(buf,t);
  }
  if(fence && code.length) out.push(`<pre class="data"><code>${code.join('\n')}</code></pre>`);
  flushFigs(lines.length);
  flushP(); flushData(); flushList();
  return out.join('\n') || '—';
}

function detailBody(p,groups,langs){

  if(STATE.tab==='statement'){
    return `<div class="sec"><h4>题面</h4><div class="card statement">${renderStatement(esc(p.statement||''), p.figures||[])}</div></div>
      <div class="sec"><h4>样例</h4>${(p.samples||[]).map((s,i)=>`
        <div class="card" style="margin-bottom:10px"><div class="hintline">样例 ${i+1}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
          <div><div class="pill">输入</div><pre class="mono" style="margin:8px 0 0;max-height:180px;overflow:auto">${esc(s.input)}</pre></div>
          <div><div class="pill">输出</div><pre class="mono" style="margin:8px 0 0;max-height:180px;overflow:auto">${esc(s.output)}</pre></div>
        </div></div>`).join('')||'<div class="empty">无样例</div>'}</div>

    const langTabs=['cpp','c','python'].map(l=>`<button class="langtab ${curLang===l?'active':''}" data-lang="${l}" ${g.solutions.some(s=>s.lang===l)?'':'disabled'}>${LANG_LABEL[l]}</button>`).join('');
    const sol=g.solutions.find(s=>s.lang===curLang)||g.solutions[0];
    const single=groups.length===1
      ? '<div class="hintline" style="margin:-6px 0 12px">本题目前只有一种通过验证的解法。若模型给出的第二种与主解结构相同（只改变量名），会被自动剔除——不拿换壳的代码冒充第二种解法。</div>'
      : '';
    return `<div class="sec"><h4>答案（选择一种解法）</h4>
      ${methodChips(groups,g.name,'answer')}${single}
      <div class="langtabs">${langTabs}</div>
      <div class="method"><div class="method-head"><span class="method-name">${esc(g.name)}</span>
        <span class="pill">${esc(g.complexity||'复杂度未声明')}</span>
        <span class="pill ${sol.verified?'green':'red'}">${sol.verified?'已验证':'未通过'}</span>
        <span class="pill">${esc(LANG_LABEL[sol.lang]||sol.lang)}</span>
        <button class="copy i-btn" style="margin-left:auto" data-copy="${esc(sol.code)}"><svg class="i i-sm"><use href="#i-copy"/></svg>复制代码</button></div>
        <div class="method-body"><pre class="code">${esc(sol.code)}</pre></div></div>
      <div class="hintline" style="margin-top:10px">同一份数据、同一份测试集，换解法不影响判题；只有复杂度与写法不同。</div></div>`;
  }
  if(STATE.tab==='analysis'){
    const a=p.analysis||{};
    if(!groups.length){
      return `${qualityFlagsHtml(a)}
        <div class="sec"><h4>题目在问什么</h4><div class="card prose">${renderProse(a.plain_question||'—')}</div></div>
        <div class="sec"><h4>难在哪</h4><div class="card prose">${renderProse(a.difficulty||'—')}</div></div>`;
    }
    if(!groups.some(g=>g.name===STATE.analysisMethod)) STATE.analysisMethod=groups[0].name;
    const g=pickMethod(groups,STATE.analysisMethod);
    const hit=(a.approaches||[]).find(x=>x&&x.name===g.name);
    let body='';
    if(hit){
      body=`<div class="prose">
        ${hit.idea?`<div class="p-sub">核心思路</div>${renderProse(hit.idea)}`:''}
        ${hit.correctness?`<div class="p-sub">为什么这样是对的</div>${renderProse(hit.correctness)}`:''}
        ${(hit.pitfalls||[]).length?`<div class="p-sub">这种写法的坑</div><ul>${hit.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      </div>`;
    }else if(g.name===groups[0].name && (a.thinking_path||[]).length){
      body=`<div class="prose"><div class="p-sub">从读题到解法</div><ol>${a.thinking_path.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;
    }else{
      body='<div class="hintline">该方法暂未生成独立解析（可在命令行跑 enrich 补齐）。</div>';
    }
    return `${qualityFlagsHtml(a)}
      <div class="sec"><h4>题目在问什么</h4><div class="card prose">${renderProse(a.plain_question||'—')}</div></div>
      <div class="sec"><h4>难在哪</h4><div class="card prose">${renderProse(a.difficulty||'—')}</div></div>
      <div class="sec"><h4>按解法看（选择一种）</h4>
        ${methodChips(groups,g.name,'analysis')}
        <div class="method"><div class="method-head"><span class="method-name">${esc(g.name)}</span>
          <span class="pill">${esc(hit&&hit.complexity?hit.complexity:(g.complexity||'复杂度未声明'))}</span></div>
          <div class="method-body">${body}</div></div></div>`;
  }
  if(STATE.tab==='hints'){
    const all=p.hints||[];
    if(!all.length) return '<div class="empty">还没有提示</div>';
    const LEVEL={2:'L2 · 算法',3:'L3 · 步骤',4:'L4 · 参考代码'};
    /* 根节点：新数据是 level 0；旧数据没有 0，用 L1 顶替并从分支里移除 */
    let rootHint=all.find(h=>h.level===0);
    let rest=all.filter(h=>h.level>0);
    let legacyRoot='';
    if(!rootHint){
      const first=rest.find(h=>h.level===1);
      if(first){ legacyRoot=first.content; rest=rest.filter(h=>h!==first); }
    }
    const groups={};
    rest.forEach(h=>{const k=h.approach||'';(groups[k]=groups[k]||[]).push(h);});
    const names=Object.keys(groups).sort((a,b)=>{
      const rank=n=>/暴力/.test(n)?9:(n?1:0);
      return rank(a)-rank(b)||a.localeCompare(b,'zh');
    });
    if(STATE.hintPid!==p.id){
      STATE.hintPid=p.id; STATE.hintApproach=''; STATE.hintUnlocked=loadHintUnlock(p.id);
    }
    const current=groups[STATE.hintApproach]?STATE.hintApproach:(names.find(n=>!/暴力/.test(n))||names[0]||'');
    STATE.hintApproach=current;
    const fallback=((p.analysis&&p.analysis.approaches)||[]).map(x=>x&&x.name).filter(Boolean);
    const approachName=n=>{
      const name=(n&&n!=='未标注方法')?n:'';
      return name||(fallback.length===1?fallback[0]:'基础解法');
    };
    const complexity={};
    ((p.analysis&&p.analysis.approaches)||[]).forEach(x=>{
      if(!x||!x.name) return;
      const cx=String(x.complexity||'');
      if(cx && !/^未声明/.test(cx)) complexity[x.name]=cx;
    });
    const branches=names.map(n=>{
      const levels=groups[n].slice().sort((a,b)=>a.level-b.level);
      const open=n===current;
      const byLevel={};
      levels.forEach(h=>{byLevel[h.level]=h;});
      /* 四级：L1 方向（通用或旧版自带的 L1）→ L2 算法 → L3 步骤 → L4 代码 */
      const text={1:(byLevel[1]&&byLevel[1].content)||rootHint&&rootHint.content||legacyRoot||'',
                  2:(byLevel[2]||{}).content||'',3:(byLevel[3]||{}).content||'',4:(byLevel[4]||{}).content||''};
      const badge={1:(byLevel[1]&&flagBadge(byLevel[1]))||(rootHint?flagBadge(rootHint):''),
                   2:byLevel[2]?flagBadge(byLevel[2]):'',3:byLevel[3]?flagBadge(byLevel[3]):'',4:byLevel[4]?flagBadge(byLevel[4]):''};
      const avail=[1,2,3,4].filter(lv=>String(text[lv]||'').trim());
      const unlocked=Number((STATE.hintUnlocked||{})[n]||0);
      const shown=avail.filter(lv=>lv<=unlocked).length;
      const next=avail.find(lv=>lv>unlocked);
      const kids=avail.map(lv=>{
        const label=lv===1?'L1 · 方向':(LEVEL[lv]||`L${lv}`);
        if(lv<=unlocked){
          const body=lv===4?`<pre class="hint-code">${esc(text[lv])}</pre>`:`<p>${esc(text[lv])}</p>`;
          return `<div class="hint-open"><div class="hint-head"><span class="hint-level">${label}</span>${badge[lv]||''}</div>${body}</div>`;
        }
        if(lv===next)
          return `<button class="hint-lock" data-unlock="${lv}"><span class="hint-level">${label}</span>
            <span>点击解锁${lv===4?'（参考代码会直接给出答案，尽量先自己写）':''}</span></button>`;
        return `<div class="hint-lock" style="opacity:.5;cursor:default"><span class="hint-level">${label}</span><span>先解锁上一级</span></div>`;
      }).join('');
      const progress=avail.length
        ? `<div class="hint-progress"><span>已解锁 ${shown}/${avail.length}</span>
            <span class="bar"><i style="width:${Math.round(shown*100/Math.max(1,avail.length))}%"></i></span>
            ${shown?`<button class="hintline" data-relock="${esc(n)}" style="text-decoration:underline">重新锁上</button>`:''}</div>`
        : '';
      return `<div class="hbranch-block">
        <button class="hbranch ${open?'active':''}" data-hint="${esc(n)}">
          <span class="hdot small"></span><span>${esc(approachName(n))}</span>
          ${complexity[n]?`<span class="hintline" style="font-weight:400">${esc(complexity[n])}</span>`:''}
          <span class="hbranch-caret">${open?'收起':'展开'}</span>
        </button>
        ${open?`<div class="hchildren">${progress}${kids||'<div class="hintline">该解法还没有提示</div>'}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="sec"><h4>提示（逐级解锁）</h4>
      <div class="hintline" style="margin:-4px 0 12px">先自己想，再点开下一级。L1 只指方向，L4 会给出参考代码。</div>
      <div class="htree"><div class="hbranches">${branches}</div></div></div>`;
  }
  if(STATE.tab==='code'){
    if(!groups.length) return '<div class="empty">还没有代码解析</div>';
    if(!groups.some(g=>g.name===STATE.codeMethod)) STATE.codeMethod=groups[0].name;
    const g=pickMethod(groups,STATE.codeMethod);
    const sol=g.solutions.find(s=>s.line_notes)||g.solutions.find(s=>s.lang==='python')||g.solutions[0];
    return `<div class="sec"><h4>代码解析（选择一种解法）</h4>
      ${methodChips(groups,g.name,'code')}
      <div class="method"><div class="method-head"><span class="method-name">${esc(g.name)}</span>
        <span class="pill">${esc(LANG_LABEL[sol.lang]||sol.lang)}</span>
        ${sol.verified?'<span class="pill green">已验证</span>':'<span class="pill red">未通过</span>'}</div>
        <div class="method-body">${sol.line_notes?renderLineNotes(sol.line_notes):'<span class="hintline">该解法还没生成逐行解析（命令行跑 enrich 可补齐）</span>'}</div></div>
      <div class="hintline" style="margin-top:10px">左侧代码取自已验证的参考解（模型不改写代码），右侧是对应每一行的讲解；重新生成后才会出现逐行对照。</div></div>`;
  }
  return dataView(p);
}

function scoreCss(v){
  const n=Number(v); if(!isFinite(n)) return {c:'var(--faint)',label:'—'};
  if(n>=90) return {c:'var(--green)',label:'优秀'};
  if(n>=70) return {c:'#d97706',label:'良好'};
  return {c:'var(--red)',label:'需改进'};
}

function scoreHtml(q,p,err){
  const layers=(q&&(q.layer_counts||q.layers))||(p&&p.layers)||[];
  const total=(q&&q.total)||0;
  /* 没有数据时不显示“0 分 / 需改进”，避免误伤；分数只在有数据时展示 */
  const hasScore=!!(q&&typeof q.score==='number'&&total>0);
  const g=scoreCss(hasScore?q.score:NaN);
  const stats=`<div class="statline">
      <span class="pill"><b>${fmt(total)}</b> 条用例</span>
      <span class="pill">去重后 ${fmt((q&&q.distinct_inputs)||0)}</span>
      ${(q&&q.duplicate_inputs)?`<span class="pill amber">重复输入 ${fmt(q.duplicate_inputs)}</span>`:`<span class="pill green">无重复输入</span>`}
      ${(q&&q.constant_outputs)?`<span class="pill amber">常量输出 ${fmt(q.constant_outputs)}</span>`:''}
      <span class="pill ${q&&q.solutions>0&&q.verified_solutions===q.solutions?'green':'amber'}">参考解 ${(q&&q.verified_solutions)||0}/${(q&&q.solutions)||0} 已验证</span>
      ${((q&&q.langs)||[]).map(l=>`<span class="pill">${esc(LANG_LABEL[l]||l)}</span>`).join('')}
    </div>`;
  const issues=(q&&Array.isArray(q.issues))?q.issues:[];

function bindDataTab(p){
  const input=$('#merge-file'), nameEl=$('#merge-file-name'), submit=$('#merge-submit'), force=$('#merge-force'), box=$('#merge-result');

    nameEl.textContent=`${f.name} · 解析中…`; submit.disabled=true;
    try{

      const text=await f.text();
      const cases=parseCasesFile(f.name,text);

    }catch(err){

/* 后端上限：cases_merge.MAX_INPUT_CHARS / MAX_OUTPUT_CHARS = 20000 */
const MAX_FIELD_CHARS = 20000;
const MAX_FILE_BYTES = 2 * 1024 * 1024;
function mergeNameLabel(){
  const m=STATE.merge;
  const miss=m.cases.filter(c=>!c.output).length;
  const over=m.cases.filter(c=>c.overlong).length;
  return `${m.name} · 解析到 ${m.cases.length} 条`
    + (miss?`（${miss} 条缺 output，会被拒绝）`:'')
    + (over?`（${over} 条超过 ${MAX_FIELD_CHARS} 字符，会被拒绝）`:'');
}
function parseCasesFile(name,text){
  const t=String(text||'').replace(/^\uFEFF/,'');
  if(/\.json$/i.test(name||'')||/^\s*[[{]/.test(t)) return normalizeCases(parseJsonCases(t));
  return normalizeCases(parseCsvCases(t));
}
function parseJsonCases(text){
  let data;
  try{ data=JSON.parse(text); }catch(e){ throw new Error('JSON 解析失败：'+e.message); }
  const arr=Array.isArray(data)?data:(Array.isArray(data&&data.cases)?data.cases:(data&&typeof data==='object'?[data]:[]));
  if(!arr.length) throw new Error('JSON 里没有用例（期望 [{"input":"…","output":"…"}]）');
  return arr;
}
/* RFC4180 风格：双引号包裹、"" 转义、字段内可含换行与逗号。
   两条硬规则，防止畸形 CSV 被"猜"成合法数据：
   1) 引号只在**字段起始**才进入引用模式；字段中间的 " 按字面字符处理（3"4 → 3"4）；
   2) 引号到文件末尾仍未闭合 → 直接报错并给出起始行号，绝不静默吞行。 */
function parseCsvCases(text){
  const rows=[]; let row=[], field='', quoted=false, line=1, quoteLine=1;
  const s=String(text||'');
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(quoted){
      if(ch==='"'){ if(s[i+1]==='"'){ field+='"'; i++; } else quoted=false; }
      else { if(ch==='\n') line++; field+=ch; }
    }else if(ch==='"'&&field.trim()===''){ quoted=true; field=''; quoteLine=line; }
    else if(ch===','){ row.push(field); field=''; }
    else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; line++; }
    else if(ch==='\r'){ /* 跳过：\r\n 由 \n 处理 */ }
    else field+=ch;
  }
  if(quoted) throw new Error(`第 ${quoteLine} 行的引号没有闭合`);
  if(field.length||row.length){ row.push(field); rows.push(row); }
  const clean=rows.filter(r=>r.some(c=>String(c).trim()!==''));
  if(!clean.length) throw new Error('CSV 是空的');
  const head=clean[0].map(h=>String(h).trim().toLowerCase());
  let iIn=head.findIndex(h=>h==='input'||h==='输入');
  let iOut=head.findIndex(h=>h==='output'||h==='输出'||h==='expected'||h==='答案');
  let body=clean.slice(1);
  if(iIn<0&&iOut<0){ iIn=0; iOut=1; body=clean; }        /* 无表头：按前两列 */
  if(iIn<0||iOut<0) throw new Error('CSV 缺少列：需要表头 input,output');
  return body.map(r=>({input:r[iIn],output:r[iOut]}));
}
function normalizeCases(arr){
  const out=[];
  for(const it of arr){
    if(!it||typeof it!=='object'){ out.push({input:'',output:''}); continue; }
    const input=String(it.input!=null?it.input:(it.in!=null?it.in:''));
    const output=String(it.output!=null?it.output:(it.out!=null?it.out:(it.expected!=null?it.expected:'')));
    out.push({input,output,overlong:(input.length>MAX_FIELD_CHARS||output.length>MAX_FIELD_CHARS)?1:0});
  }
  return out;
}
function mergeResultHtml(){
  const m=STATE.merge;
  if(m.error) return `<div class="note" style="border-color:#fecaca;background:var(--red-soft);color:#991b1b">解析失败：${esc(m.error)}</div>`;

  if(!r) return '';
  const added=Number(r.added||0), skipped=Number(r.skipped||0), rejected=r.rejected||[];
  const rows=rejected.map(x=>`<div class="case-row" style="grid-template-columns:56px 1fr 120px 120px">
      <div class="num" style="color:var(--red);font-weight:700">#${Number(x.index)+1}</div>
      <div>${esc(x.reason||'被拒绝')}</div>

      <div class="mono" style="max-height:60px;overflow:auto">${esc(x.actual==null?'—':String(x.actual))}</div>
    </div>`).join('');
  const parsed=STATE.merge.cases;
  const sample=parsed&&parsed[Number((rejected[0]||{}).index)];
  const banner=added?`<div class="issue ${m.forced?'warn':'ok'}" style="margin-top:9px">
      <svg class="i i-sm"><use href="#${m.forced?'i-alert':'i-check-circle'}"/></svg>
      <div class="msg">${m.forced
        ? `本次 ${added} 条<b>未通过参考解校验</b>（force 入库），信任级别标记为「未校验」reference_only —— 下方预览会用琥珀色标出，不要当成标准答案。`
        : `本次 ${added} 条已通过全部已验证参考解校验（cross_verified）。`}</div></div>`:'';
  /* 后端保证 added+skipped+rejected.length === cases.length（按 input_hash 去重），不一致只在控制台提示 */
  const sent=(STATE.merge.sent!=null)?Number(STATE.merge.sent):null;
  if(sent!=null && (added+skipped+rejected.length)!==sent){

    </div>${banner}
    ${rejected.length?`<div class="case-table">
      <div class="case-row head" style="grid-template-columns:56px 1fr 120px 120px"><div>序号</div><div>原因</div><div style="text-align:right">期望</div><div style="text-align:right">实际</div></div>
      ${rows}</div>
      ${sample?`<div class="hintline" style="margin-top:8px">被拒样例的输入：</div><pre class="mono" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px;margin:6px 0 0;max-height:120px;overflow:auto">${esc(sample.input)}</pre>`:''}
      <div class="hintline" style="margin-top:8px">如果确认这些数据本身正确（是参考解有误），可以勾选“忽略校验强制入库”后重新提交。</div>`
    :`<div class="hintline" style="margin-top:6px">${added?'新数据已写入并刷新统计。':'没有可入库的数据。'}</div>`}`;
}
async function submitMerge(p){
  const m=STATE.merge, submit=$('#merge-submit'), box=$('#merge-result');
  if(!m.cases.length) return;
  m.busy=true; submit.disabled=true; submit.textContent='提交中…';
  try{
    const cases=m.cases.map(c=>({input:c.input,output:c.output}));
    const wasForce=!!m.force;
    m.sent=cases.length;
    const r=await postJSON(`/api/problems/${p.id}/cases`,{cases,layer:'user',force:wasForce});
    m.result=r; m.error=''; m.forced=wasForce;
    if(box) box.innerHTML=mergeResultHtml();
    const added=Number(r.added||0), bad=(r.rejected||[]).length;
    toast(`入库 ${added} 条${bad?`，拒绝 ${bad} 条`:''}`);
    /* 不要替用户勾选 force：写库是不可逆动作，必须由用户显式确认（契约 §4.2） */
    if(added){
      /* 就地刷新统计，不重渲染整页：保留刚刚的入库结果提示 */
      STATE.qualityCache[p.id]=null; STATE.exportsCache[p.id]=null;
      const fresh=await apiTry(`/api/problems/${p.id}`);
      const next=(fresh.ok&&fresh.data)?fresh.data:p;
      STATE.problem=next;
      paintLayers(next); paintPreviews(next);
      refreshQuality(next);        /* 合并入库成功：显式刷一次评分 */
      loadExports(next);
    }
  }catch(e){
    m.error=''; m.result=null;
    if(box) box.innerHTML=`<div class="note" style="border-color:#fecaca;background:var(--red-soft);color:#991b1b" title="POST /api/problems/${p.id}/cases · ${esc(cleanErr(e.message))}">提交失败：${esc(humanErr(e.message))}。文件已解析好，接口可用后可直接点“合并入库”重试。</div>`;
  }finally{
    m.busy=false; submit.textContent='合并入库'; submit.disabled=!m.cases.length;
  }
}

/* ───────────── 任务状态徽标 ───────────── */
function jobBadgeHtml(job,p){
  if(!job||!job.status) return '';
  const st=String(job.status).toLowerCase();
  if(st==='none'||st==='idle'||st==='') return '';        /* 没有任务记录 */
  if(st==='queued'){
    const ahead=Number(job.ahead||0);
    return `<span class="pill" title="前面的任务结束会自动开始，不用刷新页面">排队中${ahead>0?` · 前面还有 ${ahead} 个`:''}</span>`;
  }
  if(st==='running') return `<span class="pill amber job-pill"><span class="dot"></span>生成中…${job.started_at?`<span class="hintline" style="color:inherit">${esc(fmtAgo(job.started_at))}开始</span>`:''}</span>`;
  if(st==='failed') return `<span class="pill red">生成失败</span>${job.error?`<span class="job-err">${esc(String(job.error).slice(0,160))}</span>`:''}${job.advice?`<span class="job-err" style="color:var(--amber)">${esc(job.advice)}</span>`:''}`;
  if(st==='done'){
    /* 只有在本次会话里看着它跑完、或刚结束不久才提示，避免和“已就绪”长期重复 */
    const watched=p&&STATE.jobDone[p.id];
    const t=job.finished_at?new Date(String(job.finished_at).replace(' ','T')).getTime():0;
    const fresh=t&&Math.abs(Date.now()-t)<10*60*1000;
    return (watched||fresh)?`<span class="pill green">生成完成</span>`:'';
  }
  return `<span class="pill">${esc(st)}</span>`;
}
function paintJobBadge(job,p){
  const el=$('#job-badge'); if(!el) return;
  el.innerHTML=jobBadgeHtml(job,p);
}
async function watchJob(p){
  /* 快速切页签会让 renderDetail 重叠调用：用世代号 + 局部 timer 句柄，
     保证旧的那条轮询一定被停掉（否则每次切换都会多留一个永久 3s 轮询） */
  const gen=(STATE._jobGen=(STATE._jobGen||0)+1);
  if(STATE._jobTimer){ clearInterval(STATE._jobTimer); STATE._jobTimer=null; }
  const alive=()=>gen===STATE._jobGen;
  let prev='', timer=null;
  const stopTimer=()=>{ if(timer){ clearInterval(timer); if(STATE._jobTimer===timer) STATE._jobTimer=null; timer=null; } };
  const step=async()=>{
    const r=await apiTry(`/api/problems/${p.id}/job`);
    if(!alive()) return 'stale';
    if(!r.ok||!r.data||!r.data.status){
      /* 任务接口未接入：退回按题目状态轮询（老逻辑） */
      paintJobBadge(p.status==='preparing'?{status:'running'}:null,p);
      if(p.status!=='prepared'&&p.status!=='failed') watchGeneration(p);
      return 'stop';
    }
    const job=r.data, st=String(job.status||'').toLowerCase();
    if(!st||st==='none'||st==='idle'){ prev=st; paintJobBadge(null,p); return 'idle'; }
    const wasActive=prev==='running'||prev==='queued';
    prev=st;
    if(st==='done'&&wasActive) STATE.jobDone[p.id]=true;   /* 本次会话看着它完成 */
    paintJobBadge(job,p);
    if(st==='running'||st==='queued'){
      /* 排队/在跑都不能再点「开始生成」，否则只会拿到一条"已有任务"的报错 */
      const genBtn=$('#gen-btn');
      if(genBtn){ genBtn.disabled=true; genBtn.textContent=st==='queued'?'排队中…':'生成中…'; }
      return 'active';
    }
    if(wasActive){
      if(st==='done'){ toast('生成完成，数据已刷新'); refreshQuality(STATE.problem||p); }
      else toast('生成失败：'+(job.error||'未知原因'));
      await refreshDetail(p.id);   /* 终态要重绘：把「排队中/生成中」的按钮放回可点状态 */
    }
    return 'done';
  };
  const first=await step();
  if(!alive()) return;
  if(first==='active'){
    timer=setInterval(async()=>{
      const s=await step();
      if(s!=='active') stopTimer();
    },3000);
    STATE._jobTimer=timer;
  }
}
async function refreshDetail(id){
  try{
    const p=await api(`/api/problems/${id}`);
    STATE.problem=p; renderDetail(p);
  }catch(e){ /* 静默：保留当前视图 */ }
}

async function loadDetail(id){
  try{
    const p=await api(`/api/problems/${id}`);
    STATE.revealed=Number(ROUTE.get('reveal')||0); STATE.tab=ROUTE.get('tab')||'statement';
    STATE.studentCode={}; STATE.runResult=null; STATE.diagnosis=null; STATE.answerUnlocked=false;
    STATE.lang=ROUTE.get('lang')||STATE.lang;
    renderDetail(p);
  }catch(e){ $('#view-detail').innerHTML='<div class="empty"><svg class="i"><use href="#i-alert"/></svg>题目不存在或加载失败</div>'; }
}

async function refreshModelBadge(){
  try{ const s=await api('/api/settings'); const b=$('#model-badge');
    const txt=$('#model-text'); if(txt) txt.textContent=s.key_set?`默认 ${s.model||'未配置模型'}`:'未配置 Key';
    b.className='pill'+(s.key_set?' green':' red'); b.title=`生成默认模型（练习页可单独选）· 来源：${SOURCE_LABEL[s.key_source]||s.key_source}`;
  }catch(e){}
}
async function openSettings(){
  try{
    const s=await api('/api/settings');
    $('#s-base').value=s.base_url||'';
    const sel=$('#s-model'), custom=$('#s-model-custom'), models=s.models||[];
    sel.innerHTML=models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')+'<option value="__custom__">自定义…</option>';
    if(models.includes(s.model)){sel.value=s.model;custom.hidden=true;} else {sel.value='__custom__';custom.hidden=false;custom.value=s.model||'';}
    $('#s-key').value='';
    $('#s-keyinfo').textContent=s.key_set?`已保存：${s.key_masked}（${SOURCE_LABEL[s.key_source]||s.key_source}）`:'尚未配置 Key';
    $('#s-status').textContent=''; $('#s-status').className='statusline';
    $('#settings-modal').hidden=false;
  }catch(e){ toast('读取设置失败'); }
}
function closeSettings(){ $('#settings-modal').hidden=true; }
async function saveSettings(){
  const sel=$('#s-model'); const model=sel.value==='__custom__'?$('#s-model-custom').value.trim():sel.value;
  const payload={base_url:$('#s-base').value.trim(),model}; const key=$('#s-key').value.trim(); if(key) payload.api_key=key;
  const st=$('#s-status'); st.textContent='保存中…'; st.className='statusline';
  try{ const s=await postJSON('/api/settings',payload);                 /* 显式 application/json */
    if(s.error) throw new Error(s.error);
    st.textContent='已保存：'+s.model; st.className='statusline ok'; await refreshModelBadge(); setTimeout(closeSettings,600);
  }catch(e){ st.textContent='保存失败：'+cleanErr(e.message); st.className='statusline bad'; }
}
async function testSettings(){
  const st=$('#s-status'); st.textContent='测试中…'; st.className='statusline';
  try{ const d=await postJSON('/api/settings/test',{});                /* 无参数也要带 JSON 头+空对象体 */
    st.textContent=d.ok?`连接成功，可用模型 ${d.models.length} 个`:`连接失败：${d.error||d.status}`; st.className='statusline '+(d.ok?'ok':'bad');
  }catch(e){ st.textContent='连接失败：'+cleanErr(e.message); st.className='statusline bad'; }
}

function bind(){
  $('#settings').onclick=openSettings; $('#s-cancel').onclick=closeSettings; $('#s-save').onclick=saveSettings; $('#s-test').onclick=testSettings;
  $('#s-eye').onclick=()=>{const i=$('#s-key');i.type=i.type==='password'?'text':'password';$('#s-eye').textContent=i.type==='password'?'显示':'隐藏';};
  $('#s-model').onchange=e=>{const c=$('#s-model-custom');c.hidden=e.target.value!=='__custom__';if(!c.hidden)c.focus();};
  $('#settings-modal').onclick=e=>{if(e.target.id==='settings-modal')closeSettings();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings();});
  $('#i-save').onclick=saveProblem;
  $('#i-file-pick').onchange=async e=>{const f=e.target.files[0]; if(!f)return; $('#i-statement').value=await f.text(); if(!$('#i-title').value) $('#i-title').value=f.name.replace(/\.(md|txt)$/i,''); updateBatchCount();};
  const batchToggle=$('#i-batch'); if(batchToggle) batchToggle.onchange=()=>setBatchMode(batchToggle.checked);
  const iStatement=$('#i-statement'); if(iStatement) iStatement.addEventListener('input',updateBatchCount);
  $$('.chip[data-filter]').forEach(c=>c.onclick=()=>{$$('.chip[data-filter]').forEach(x=>x.classList.remove('active'));c.classList.add('active');STATE.filter=c.dataset.filter;renderList();});
  const q=$('#q'); if(q) q.addEventListener('input',()=>{STATE.q=q.value;renderList();});
  document.addEventListener('keydown',e=>{
    if(e.key==='/' && document.activeElement!==$('#q') && $('#q')){ e.preventDefault(); $('#q').focus(); }
  });
  $('#tier').onchange=e=>{STATE.tier=e.target.value;renderList();};
  $('#tag').onchange=e=>{STATE.tag=e.target.value;renderList();};
}

async function boot(){
  try{ await ensureBridge(); }catch(e){ console.error(e); }
  bind(); await refreshModelBadge();
  const pid=ROUTE.get('problem');
  if(pid){ show('detail'); await loadDetail(Number(pid)); return; }
  if(ROUTE.get('view')==='library'){ show('library'); await loadLibrary(); return; }
  show('workbench'); await loadRecent();
}
boot();
</script>
